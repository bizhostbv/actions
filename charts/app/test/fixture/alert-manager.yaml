# Shape of the pilot: node container + nginx sidecar, Ingress on a sub-path, /metrics.
fullnameOverride: alert-manager
containerName: node
image:
  repository: harbor.example.com/app/node
  tag: "1.2.3"
imagePullSecrets: [{ name: harbor-pull }]
replicas: 2
ports:
  - { name: node, containerPort: 3000 }
env:
  - { name: BASE_PATH, value: /api/v1/alerts }
envFrom:
  - secretRef: { name: alert-manager }
readinessProbe:
  httpGet: { path: /api/v1/alerts, port: node }
lifecycle:
  preStop: { exec: { command: [sleep, "10"] } }
resources:
  requests: { cpu: 25m, memory: 128Mi }
sidecars:
  - name: nginx
    image: harbor.example.com/app/nginx:1.2.3
    ports: [{ name: http, containerPort: 8080 }]
    readinessProbe:
      httpGet: { path: /api/v1/alerts, port: http }
    resources:
      requests: { cpu: 25m, memory: 20Mi }
      limits: { memory: 50Mi }
service: { port: 8080 }
metrics: { port: 9464 }
ingress:
  enabled: true
  clusterIssuer: ""
  hosts:
    - host: portal.example.com
      paths: [{ path: /api/v1/alerts }]
  tls: { secretName: portal-tls }
  allowList: ["192.0.2.0/24", "2001:db8::/64"]
  annotations:
    haproxy.org/src-ip-header: CF-Connecting-IP
